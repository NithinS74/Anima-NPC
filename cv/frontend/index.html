<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skyrim CV Dashboard</title><link rel="stylesheet" href="src/styles.css"></head><body><main><header><p class="eyebrow">Standalone manual test lab</p><h1>Skyrim CV</h1><p>YOLO evidence + local VLM interpretation. No Mantella integration.</p></header><section class="panel"><label>API URL <input id="apiUrl" value="http://127.0.0.1:8000"></label><label class="upload">Screenshot (PNG/JPEG)<input id="file" type="file" accept="image/png,image/jpeg"><span id="fileName">Choose a screenshot</span></label><button id="run" disabled>Run analysis</button><p id="state" role="status">Choose an image to begin.</p></section><section id="previewSection" class="results hidden"><article><h2>Original</h2><img id="original" alt="Selected screenshot preview"></article><article><h2>YOLO annotated</h2><img id="annotated" alt="YOLO annotation preview"></article></section><section id="dataSection" class="results hidden"><article><h2>Detections</h2><div id="detections"></div></article><article><h2>Scene description</h2><div id="scene"></div></article><article><h2>Timing</h2><div id="timing"></div></article></section><section id="jsonSection" class="panel hidden"><div class="row"><h2>Validated JSON</h2><button id="copy">Copy</button><button id="download">Download</button></div><pre id="json"></pre></section></main><script src="src/app.js"></script></body></html>
